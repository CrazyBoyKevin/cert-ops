name: cert-ops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certops
      POSTGRES_USER: certops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - certops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certops -d certops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  certops:
    image: docker.io/easitwch/cert-ops:0.0.10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://certops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/certops"
      CERT_ENCRYPTION_KEY: "${CERT_ENCRYPTION_KEY:?Set CERT_ENCRYPTION_KEY in .env}"
      CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env}"
      CERTOPS_ADMIN_USERNAME: "${CERTOPS_ADMIN_USERNAME:?Set CERTOPS_ADMIN_USERNAME in .env}"
      CERTOPS_ADMIN_PASSWORD: "${CERTOPS_ADMIN_PASSWORD:?Set CERTOPS_ADMIN_PASSWORD in .env}"
      CERTOPS_SESSION_SECRET: "${CERTOPS_SESSION_SECRET:?Set CERTOPS_SESSION_SECRET in .env}"
    ports:
      - "${CERTOPS_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  certops_postgres_data:
